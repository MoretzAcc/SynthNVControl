[project]
name = "mosynthnvcontrol"
version = "0.1.0"
description = "Cross-platform desktop control application for Windfreak SynthNV devices"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.8",
    "pyserial>=3.5",
]

[project.scripts]
synthnv = "synthnvcontrol.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthnvcontrol"]
